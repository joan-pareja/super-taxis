[project]
name = "super-taxis"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2,<3",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[tool.ruff]
target-version = "py313"
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "standard"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.1",
]
