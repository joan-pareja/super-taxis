name: super-taxis

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taxi}
      POSTGRES_USER: ${POSTGRES_USER:-taxi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taxi_dev_password}
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5435}:5432"
    volumes:
      - ${POSTGRES_DATA_PATH:-C:/Docker/super-taxis/postgres/dev/data}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 20

  migrate:
    build: .
    configs:
      - source: database_settings
        target: /app/.env
    depends_on:
      db:
        condition: service_healthy

configs:
  database_settings:
    content: |
      POSTGRES_DB=${POSTGRES_DB:-taxi}
      POSTGRES_USER=${POSTGRES_USER:-taxi}
      POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-taxi_dev_password}
      POSTGRES_HOST=db
      POSTGRES_PORT=5432
